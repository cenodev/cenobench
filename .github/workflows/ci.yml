name: ci

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: python3 run.py --self-test
      - run: python3 build.py
      - run: python3 aggregate.py
      - name: indexes are valid JSON
        run: |
          python3 -c "import json; json.load(open('benchmarks/index.json')); json.load(open('results/index.json')); json.load(open('index.json'))"
